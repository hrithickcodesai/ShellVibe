[project]
name = "shellvibe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "datasets>=4.5.0",
    "fsspec>=2025.10.0",
    "levenshtein>=0.27.3",
    "llama-cpp-python>=0.3.17",
    "loguru>=0.7.3",
    "matplotlib>=3.10.8",
    "openai>=2.29.0",
    "pandas==3.0.1",
    "python-dotenv>=1.2.1",
    "rich>=13.0.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "torch>=2.6.0,<2.7.dev0",
    "tqdm>=4.67.3",
    "transformers>=4.57.1,<5.0.0",
    "wandb>=0.25.0",
    "wordcloud>=1.9.6",
]

[dependency-groups]
dev = [
    "ipywidgets>=8.1.8",
    "ruff>=0.15.1",
]
llama-cpp = [
    "gguf>=0.1.0",
    "numpy~=1.26.4",
    "protobuf>=4.21.0,<5.0.0",
    "sentencepiece>=0.1.98,<0.3.0",
    "torch>=0.0.0.dev0 ; platform_machine == 's390x'",
    "torch~=2.6.0 ; platform_machine != 's390x'",
    "transformers>=4.57.1,<5.0.0",
]
